<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Service</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    padding:40px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
}

button{
    width:100%;
    padding:14px;
    background:#38bdf8;
    color:white;
    border:none;
    cursor:pointer;
    font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<h2>Add Service</h2>

<form id="serviceForm" action="/add-service" method="POST">

    <input
type="hidden"
id="serviceId"
name="id">

<input
id="title"
type="text"
name="title"
placeholder="Service Title"
required>

<input
id="icon"
type="text"
name="icon"
placeholder="Icon (Example: 📊)"
required>

<textarea
id="description"
name="description"
placeholder="Service Description"
required></textarea>

<button id="submitBtn">
Add Service
</button>

</form>

</div>

<script>

async function loadServices(){

    const response = await fetch('/api/services');

    const services = await response.json();

    let html = `
        <hr style="margin:40px 0;">
        <h2>All Services</h2>
    `;

    services.forEach(service=>{

        html += `

        <div style="
            background:#fff;
            padding:20px;
            margin-top:20px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        ">

            <h3>${service.icon} ${service.title}</h3>

            <p>${service.description}</p>

            <button onclick="editService(
    ${service.id},
    \`${service.title}\`,
    \`${service.icon}\`,
    \`${service.description}\`
)">
    Edit
</button>

            <button
onclick="deleteService(${service.id})"
style="background:red;margin-left:10px;">
Delete
</button>

        </div>

        `;

    });

    document.body.innerHTML += html;

}

loadServices();

function deleteService(id){

    if(confirm("Are you sure you want to delete this service?")){

        window.location.href = `/delete-service/${id}`;

    }

}

function editService(id, title, icon, description){

    document.getElementById("serviceId").value = id;

    document.getElementById("title").value = title;

    document.getElementById("icon").value = icon;

    document.getElementById("description").value = description;

    document.getElementById("submitBtn").innerText = "Update Service";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

const form = document.getElementById("serviceForm");

form.addEventListener("submit", function () {

    const id = document.getElementById("serviceId").value;

    if (id !== "") {

        form.action = "/update-service";

    } else {

        form.action = "/add-service";

    }

});

</script>

</body>
</html>
