<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Project - PARMAR</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    padding:40px;
}

.container{
    max-width:700px;
    margin:auto;
}

form{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h1{
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    font-weight:bold;
}

input, textarea, select{

    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;

}

textarea{
    height:120px;
}

button{

    margin-top:25px;
    width:100%;
    padding:14px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;

}

button:hover{
    background:#1d4ed8;
}

</style>

</head>


<body>


<div class="container">


<h1>Add New Project</h1>


<form action="/add-project" method="POST" enctype="multipart/form-data">


<label>Project Title</label>

<input 
type="text"
name="title"
placeholder="Sales Dashboard"
required>


<label>Technology</label>

<select name="technology" required>

<option value="">Select Technology</option>

<option>Power BI</option>

<option>SQL</option>

<option>Python</option>

<option>Java</option>

<option>HTML/CSS/JavaScript</option>

</select>



<label>Description</label>

<textarea 
name="description"
placeholder="Project description..."
required></textarea>



<label>GitHub Link</label>

<input 
type="url"
name="github"
placeholder="https://github.com/">



<label>Live Demo Link</label>

<input 
type="url"
name="demo"
placeholder="https://">



<label>Project Cover Image</label>

<input 
type="file"
name="image"
accept="image/*"
required>



<button type="submit">
Save Project
</button>


</form>


</div>


</body>

</html>
