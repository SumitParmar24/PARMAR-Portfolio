<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Details - PARMAR</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.main-image{
    width:100%;
    max-height:400px;
    object-fit:cover;
    border-radius:15px;
}

h1{
    margin-top:20px;
}

.info{
    margin-top:15px;
    line-height:1.7;
}


.gallery{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:30px;

}


.gallery img{

    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:15px;

}

.gallery-card{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.gallery-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.gallery-content{
    padding:15px;
}

.gallery-content h3{
    margin-bottom:8px;
}

.gallery-content p{
    color:#64748b;
    font-size:14px;
}


</style>

</head>


<body>


<div class="container">

<div class="card">


<img id="projectImage" class="main-image">


<h1 id="title"></h1>


<div class="info">

<p>
<b>Technology:</b>
<span id="technology"></span>
</p>


<p id="description"></p>


</div>



<h2>Project Gallery</h2>


<div class="gallery" id="gallery">

</div>


</div>


</div>



<script>


const urlParams = new URLSearchParams(window.location.search);

const projectId = urlParams.get("id");



async function loadProject(){


const res = await fetch(`/api/project/${projectId}`);

const project = await res.json();


document.getElementById("projectImage").src = project.image;

document.getElementById("title").innerText = project.title;

document.getElementById("technology").innerText = project.technology;

document.getElementById("description").innerText = project.description;


}



async function loadGallery(){


const res = await fetch(`/api/project-images/${projectId}`);

const images = await res.json();


const gallery = document.getElementById("gallery");


images.forEach(img=>{


gallery.innerHTML += `

<div class="gallery-card">

    <img src="${img.image}">

    <div class="gallery-content">

        <h3>${img.title || 'Project Image'}</h3>

        <p>${img.description || ''}</p>

    </div>

</div>

`;


});


}



loadProject();

loadGallery();


</script>


</body>

</html>
