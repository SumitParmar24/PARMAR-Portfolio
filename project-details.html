<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Details - PARMAR</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    padding:40px;
}

.container{
    max-width:1400px;
    width:95%;
    margin:auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.main-image{
    width:100%;
    height:auto;
    display:block;
    border-radius:15px;
    object-fit:contain;
}

h1{
    margin-top:20px;
}

.info{
    margin-top:15px;
    line-height:1.7;
}


.gallery{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:30px;

}




.gallery-card{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.gallery-card img{
    width:100%;
    height:300px;
    object-fit:contain;
    background:#111;
    display:block;
}



.gallery-content{
    padding:15px;
}

.gallery-content h3{
    margin-bottom:8px;
}

.gallery-content p{
    color:#64748b;
    font-size:14px;
}

.gallery-card{
    transition:.3s;
    cursor:pointer;
}

.gallery-card a{
    display:block;
}

.gallery-card img{
    width:100%;
    height:230px;
    object-fit:contain;
    background:#111;
    display:block;
    cursor:pointer;
}

.gallery-card:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 30px rgba(0,0,0,.15);
}

.main-image{
    width:100% !important;
    height:auto !important;
    max-height:none !important;
    object-fit:contain !important;
}

.gallery-card img{
    width:100% !important;
    height:auto !important;
    max-height:none !important;
    object-fit:contain !important;
}




</style>

</head>


<body>


<div class="container">

<div class="card">


<img id="projectImage" class="main-image">


<h1 id="title"></h1>


<div class="info">

<p>
<b>Technology:</b>
<span id="technology"></span>
</p>


<p id="description"></p>


</div>



<h2>Project Gallery</h2>


<div class="gallery" id="gallery">

</div>


</div>


</div>



<script>


const urlParams = new URLSearchParams(window.location.search);

const projectId = urlParams.get("id");



async function loadProject(){


const res = await fetch(`/api/project/${projectId}`);

const project = await res.json();


document.getElementById("projectImage").src = project.image;

const mainImg = document.getElementById("projectImage");
mainImg.src = project.image;
mainImg.onclick = () => window.open(project.image, "_blank");
mainImg.style.cursor = "pointer";

document.getElementById("title").innerText = project.title;

document.getElementById("technology").innerText = project.technology;

document.getElementById("description").innerText = project.description;


}



async function loadGallery(){

    const res = await fetch(`/api/project-images/${projectId}`);
    const images = await res.json();

    const gallery = document.getElementById("gallery");

    gallery.innerHTML = "";

    if(images.length === 0){
        gallery.innerHTML = "<p>No gallery images found.</p>";
        return;
    }

    images.forEach(img=>{

        gallery.innerHTML += `
        <div class="gallery-card">

            <img src="${img.image}"
            alt="${img.title}"
            onclick="window.open('${img.image}','_blank')"
            style="width:100%; height:230px; object-fit:contain; background:#111; cursor:pointer;">

            <div class="gallery-content">
                <h3>${img.title}</h3>
                <p>${img.description}</p>
            </div>

        </div>
        `;

    });

}



loadProject();

loadGallery();


</script>


</body>

</html>
